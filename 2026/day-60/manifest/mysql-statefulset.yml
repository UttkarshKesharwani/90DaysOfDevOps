

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-statefulset
  namespace: capstone
spec:
  selector:
    matchLabels:
      app: mysql
  serviceName: mysql-headless-service
  replicas: 3
  template: 
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql-containers
        image: mysql:8.0
        ports:
          - containerPort: 3306
        envFrom:
        - secretRef:
            name: mysql-secret
        volumeMounts:
        - name: mysql-volume
          mountPath: /var/lib/mysql
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: 500m
            memory: 1Gi


  volumeClaimTemplates:
  - metadata:
      name: mysql-volume
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: ""
      resources:
        requests:
          storage: 1Gi
      
